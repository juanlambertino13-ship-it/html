<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Mis Apps</title>
</head>


<body style="background-color: rgb(201, 187, 187); margin: 0; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh;">



    <div style="position: absolute; top: 15px; left: 20px; background-color: #2c3e50; color: white; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 22px; box-shadow: 2px 2px 8px rgba(0,0,0,0.4);">
        🚀 Mis<span style="color: #00d2d3;">Apps</span>
    </div>


    <div style="background-color: white; padding: 30px; border-radius: 10px; width: 100%; max-width: 320px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
        
        <h2 style="text-align: center; color: #2c3e50; margin-top: 0;">Iniciar Sesión</h2>

        <form action="dashboard.html" method="GET">
            <p style="margin: 0 0 5px 0; font-size: 14px;"><b>Correo:</b></p>
            <input type="email" placeholder="usuario@ejemplo.com" required style="width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px;">

            <p style="margin: 0 0 5px 0; font-size: 14px;"><b>Contraseña:</b></p>
            <input type="password" placeholder="********" required style="width: 100%; padding: 10px; margin-bottom: 20px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px;">

            <button type="submit" style="width: 100%; padding: 10px; background-color: #2c3e50; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">Ingresar</button>
            
        </form>

        <p style="text-align: center; font-size: 13px; margin-top: 15px; margin-bottom: 0;">
            ¿No tienes cuenta? <a href="registro.html" style="color: #00d2d3; font-weight: bold; text-decoration: none;">Regístrate</a>
        </p>

    </div>
    
    
  
</body>
</html>
